# Ligne de commande du noyau par défaut pour Noos Android x86_64
# Support de l'auto-détection GPU, résolution TV/Moniteur, DPI et mode d'exécution
CMDLINE_COMMON="root=/dev/ram0 androidboot.hardware=android_x86_64 androidboot.selinux=permissive quiet loglevel=3"

# Profil TV (Mini PC -> TV) : résolution fluide, DPI TV adapté, accélération matérielle
CMDLINE_TV="EDITION=tv DPI=280 GRALLOC=gbm VULKAN=1"

# Profil Bureau (Mini PC -> PC de bureau) : mode multi-fenêtres, curseur souris, DPI 160
CMDLINE_DESKTOP="EDITION=desktop DPI=160 GRALLOC=gbm VULKAN=1 freeform=1"
