# ==============================================================================
# Configuration GRUB 2 pour Noos Android x86_64 (UEFI & BIOS)
# Version du noyau : Linux 6.12 LTS avec support Android & ARM NativeBridge
# ==============================================================================

set timeout=5
set default=0

# Configuration graphique GRUB
if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
else
    insmod vbe
    insmod vga
fi

insmod font
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod ext2
insmod fat
insmod iso9660

set gfxmode=auto
terminal_output gfxterm

# Menu Principal
menuentry "1. Noos Android TV Edition (Mini PC -> TV / Leanback)" --class android --class os {
    search --no-floppy --file /kernel --set=root
    echo "Chargement du noyau Noos Linux 6.12 LTS (Profil TV)..."
    linux /kernel root=/dev/ram0 androidboot.hardware=android_x86_64 androidboot.selinux=permissive EDITION=tv DPI=280 GRALLOC=gbm VULKAN=1 console=ttyS0,115200 console=tty0 earlyprintk=serial,ttyS0,115200
    echo "Chargement du ramdisk initial Noos..."
    initrd /initrd.img
}

menuentry "2. Noos Android Desktop Edition (PC de bureau / Multi-fenêtres)" --class android --class os {
    search --no-floppy --file /kernel --set=root
    echo "Chargement du noyau Noos Linux 6.12 LTS (Profil Bureau)..."
    linux /kernel root=/dev/ram0 androidboot.hardware=android_x86_64 androidboot.selinux=permissive EDITION=desktop DPI=160 GRALLOC=gbm VULKAN=1 freeform=1 console=ttyS0,115200 console=tty0 earlyprintk=serial,ttyS0,115200
    echo "Chargement du ramdisk initial Noos..."
    initrd /initrd.img
}

menuentry "3. Noos Android Live Mode (Découverte en RAM sans installation)" --class android --class os {
    search --no-floppy --file /kernel --set=root
    echo "Démarrage en mode Live..."
    linux /kernel root=/dev/ram0 androidboot.hardware=android_x86_64 androidboot.selinux=permissive EDITION=tv DPI=280 console=tty0 console=ttyS0,115200
    initrd /initrd.img
}

menuentry "4. Installer Noos Android sur disque interne (SSD / NVMe)" --class install {
    search --no-floppy --file /kernel --set=root
    echo "Démarrage de l'installateur Noos..."
    linux /kernel root=/dev/ram0 androidboot.hardware=android_x86_64 AUTO_INSTALL=1 console=tty0 console=ttyS0,115200
    initrd /initrd.img
}

menuentry "5. Mode Débogage & Restauration (Console texte & Fallback)" --class debug {
    search --no-floppy --file /kernel --set=root
    echo "Démarrage en mode sans échec..."
    linux /kernel root=/dev/ram0 androidboot.hardware=android_x86_64 DEBUG=1 nomodeset console=tty0 console=ttyS0,115200
    initrd /initrd.img
}
